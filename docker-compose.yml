version: '3.8'

services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: skyvoyage-backend
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
      - ML_SERVICE_URL=http://ml-service:5001
    volumes:
      - backend-data:/app/data
    depends_on:
      - ml-service
    restart: unless-stopped

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: skyvoyage-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: skyvoyage-ml-service
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
    restart: unless-stopped

volumes:
  backend-data:
